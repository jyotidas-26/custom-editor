<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML/CSS Editor</title>
    <style>
        body {
            background: none !important;
            height: 100%;
            margin: 20px;
            padding: 0;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }
        h1, h2 {
            text-align: center;
        }
        h1 {
            font-size: 2em;
        }
        h3 {
            margin-top: 20px;
        }
        textarea {
            background: #fff !important;
            width: 100%;
            margin: 0 20px 0 0;
            height: 200px;
            border-radius: 5px;
            border-color: #555;
            font-family: "Source Code Pro", monospace;
            font-size: 1em;
            resize: none;
        }
        textarea:hover, textarea:focus {
            background: #fff !important;
            outline: none;
        }
        .grid {
            width: 100%;
            float: left;
            overflow: hidden;
            box-sizing: border-box;
            padding: 0 30px 0 0;
        }
        .edit {
            background: #fff !important;
            padding: 5px;
        }
        .output {
            background: #fff;
            border-left: 1px solid #f3f3f3;
            overflow: hidden;
            padding: 0 20px;
            margin: 20px 0;
        }
        .output-wrap {
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            min-height: 200px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            font-size: 1em;
            cursor: pointer;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .box-wrap{
         display: flex;
        }
        .box-wrap > div{
         width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>HTML/CSS Editor</h1>
        <h2>Put something between the tags or replace them altogether...</h2>
    </header>

    <div class="container grid">
      
        <form>
           <div class="box-wrap">
              <div>
                  <h3>HTML</h3>
                  <textarea id="html" class="edit"><h1></h1></textarea>
              </div>

               <div>
                  <h3>CSS</h3>
                  <textarea id="css" class="edit">h1 {}</textarea>     
               </div>     
           </div>
           <button type="button" id="saveBtn">Save</button>
        </form>
    </div>

    <div class="output">
        <div class="output-wrap" id="output-wrap"></div>
    </div>

    <style>
      .select-menu {
  max-width: 330px;
  margin: 50px auto;
}
.select-menu .select-btn {
  display: flex;
  height: 55px;
  background: #fff;
  padding: 20px;
  font-size: 18px;
  font-weight: 400;
  border-radius: 8px;
  align-items: center;
  cursor: pointer;
  justify-content: space-between;
  box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
}
.select-menu .options {
  position: absolute;
  width: 330px;
  overflow-y: auto;
  max-height: 295px;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
  animation-name: fadeInDown;
  -webkit-animation-name: fadeInDown;
  animation-duration: 0.35s;
  animation-fill-mode: both;
  -webkit-animation-duration: 0.35s;
  -webkit-animation-fill-mode: both;
}
.select-menu .options .option {
  display: flex;
  height: 55px;
  cursor: pointer;
  padding: 0 16px;
  border-radius: 8px;
  align-items: center;
  background: #fff;
}
.select-menu .options .option:hover {
  background: #f2f2f2;
}
.select-menu .options .option i {
  font-size: 25px;
  margin-right: 12px;
}
.select-menu .options .option .option-text {
  font-size: 18px;
  color: #333;
}

.select-btn i {
  font-size: 25px;
  transition: 0.3s;
}

.select-menu.active .select-btn i {
  transform: rotate(-180deg);
}
.select-menu.active .options {
  display: block;
  opacity: 0;
  z-index: 10;
  animation-name: fadeInUp;
  -webkit-animation-name: fadeInUp;
  animation-duration: 0.4s;
  animation-fill-mode: both;
  -webkit-animation-duration: 0.4s;
  -webkit-animation-fill-mode: both;
}

@keyframes fadeInUp {
  from {
    transform: translate3d(0, 30px, 0);
  }
  to {
    transform: translate3d(0, 0, 0);
    opacity: 1;
  }
}
@keyframes fadeInDown {
  from {
    transform: translate3d(0, 0, 0);
    opacity: 1;
  }
  to {
    transform: translate3d(0, 20px, 0);
    opacity: 0;
  }
}
    </style>

    <div class="select-menu active">
      <div class="select-btn">
        <span class="sBtn-text">Select your option</span>
        <i class="bx bx-chevron-down"></i>
      </div>
    
      <ul class="options">
        <li class="option">
          <i class="bx bxl-instagram-alt" style="color: #E1306C;"></i>
          <span class="option-text">Instagram</span>
        </li>
        <li class="option">
          <i class="bx bxl-linkedin-square" style="color: #0E76A8;"></i>
          <span class="option-text">Linkedin</span>
        </li>
        <li class="option">
          <i class="bx bxl-facebook-circle" style="color: #4267B2;"></i>
          <span class="option-text">Facebook</span>
        </li>
        <li class="option">
          <i class="bx bxl-twitter" style="color: #1DA1F2;"></i>
          <span class="option-text">Twitter</span>
        </li>
      </ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const htmlInput = document.getElementById("html");
            const cssInput = document.getElementById("css");
            const outputWrap = document.getElementById("output-wrap");
            const saveBtn = document.getElementById("saveBtn");

            // Load saved data from localStorage
            if (localStorage.getItem("htmlContent")) {
                htmlInput.value = localStorage.getItem("htmlContent");
            }
            if (localStorage.getItem("cssContent")) {
                cssInput.value = localStorage.getItem("cssContent");
            }

            // Function to update the output
            function updateOutput() {
                const htmlContent = htmlInput.value;
                const cssContent = `<style>${cssInput.value}</style>`;
                outputWrap.innerHTML = cssContent + htmlContent;
            }

            // Event listeners for real-time update
            htmlInput.addEventListener("input", updateOutput);
            cssInput.addEventListener("input", updateOutput);

            // Save function
            function saveContent() {
                localStorage.setItem("htmlContent", htmlInput.value);
                localStorage.setItem("cssContent", cssInput.value);
                alert("Content saved!");
            }

            // Event listener for save button
            saveBtn.addEventListener("click", saveContent);

            // Initial call to display output
            updateOutput();
        });




        
            const optionMenu = document.querySelector(".select-menu"),
            selectBtn = optionMenu.querySelector(".select-btn"),
            options = optionMenu.querySelectorAll(".option"),
            sBtn_text = optionMenu.querySelector(".sBtn-text");

            selectBtn.addEventListener("click", () =>
            optionMenu.classList.toggle("active")
            );

            options.forEach((option) => {
            option.addEventListener("click", () => {
               let selectedOption = option.querySelector(".option-text").innerText;
               sBtn_text.innerText = selectedOption;

               optionMenu.classList.remove("active");
            });
            });

    </script>

</body>
</html>
